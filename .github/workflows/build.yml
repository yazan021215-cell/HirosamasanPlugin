
name: Build HirosamasanPlugin

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download source project
        run: |
          curl -L -o source.zip "SOURCE_ZIP_URL"

      - name: Extract source
        run: unzip -q source.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build plugin
        run: |
          cd project
          gradle build --no-daemon
